; Настройки подбора кросс-артикулов.
; Строки, начинающиеся с «;», — комментарии.
; Названия столбцов: если в выгрузке столбец называется по-другому — допишите вариант через « | ».
; Регистр, лишние пробелы и «ё/е» не важны. Порядок столбцов в файлах не важен.

[Отбор]
; Если по бренду-конкуренту у артикула кроссов «Да» меньше этого числа — добираем кроссы «Нет».
; 1 = «Нет» берём только когда «Да» нет совсем. 2 = добираем «Нет», если «Да» меньше двух, и т.д.
мин_да = 1

; Сколько максимум кроссов «Нет» добирать на один бренд-конкурент (0 = все найденные).
макс_нет = 0

; Открыть готовый файл после расчёта (да/нет).
открыть_результат = да

[Столбцы_кроссы]
; Файл «Кроссы свод».
артикул = Артикул
бренд = Бренд
артикул_кросс = Артикул кросс
бренд_кросс = Бренд кросс
сравнение_цен = Использовать для сравнения цен
; Необязательные: если их нет, поисковые артикулы будут посчитаны из обычных.
артикул_поиск = Артикул поиск
артикул_кросс_поиск = Артикул кросс поиск
код = Код

[Столбцы_прайс]
; Ваш файл с ценами. Обязательны артикул и бренд.
; Подгруппа (или хотя бы группа) нужна, чтобы выбрать конкурентов именно по позиционированию.
артикул = Артикул | Артикул товара | Каталожный номер
бренд = Бренд | Торговая марка | ТМ | Производитель
категория = Категория NEW | Категория
группа = Группа NEW | Группа
подгруппа = Подгруппа NEW | Подгруппа
; Эти столбцы прайса (если есть) просто переносятся в результат рядом с артикулом.
доп_столбцы = Код | Код товара | Наименование | Номенклатура | Цена

[Столбцы_позиционирование]
; Файл позиционирования (нужен, только если хотите заменить встроенное).
; Столбцы конкурентов ищутся по шаблону «Бренд конкурент N», процент — следующий столбец «% ...».
категория = Категория NEW | Категория
группа = Группа NEW | Группа
подгруппа = Подгруппа NEW | Подгруппа
бренд = Торговая марка | Бренд
